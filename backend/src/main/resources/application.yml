spring:
  application:
    name: employee-tracker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tracker}
    username: ${DB_USER:tracker}
    password: ${DB_PASSWORD:tracker}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  session:
    store-type: jdbc
    timeout: 30m
    jdbc:
      initialize-schema: never
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:25}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
  jackson:
    default-property-inclusion: non_absent
    deserialization:
      fail-on-unknown-properties: true

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: true
        same-site: lax
  error:
    include-stacktrace: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

tracker:
  data-key:
    active-id: ${TRACKER_DATA_KEY_ID:}
  app-base-url: ${TRACKER_APP_BASE_URL:http://localhost:8080}
  mail:
    from: ${TRACKER_MAIL_FROM:no-reply@example.com}
